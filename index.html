<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Write — Distraction-Free Writing</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="brand">Focus Write</div>
    <div class="controls">
      <span id="session-timer">--:--</span>
      <button id="download-btn" title="Download your text as a .txt file">Download .txt</button>
    </div>
  </div>

  <!-- SETUP -->
  <div id="setup-screen">
    <h1>Write without stopping.</h1>
    <p>Pick a session length and start typing. If you pause for too long, your words start to fade — and disappear.</p>
    <div class="setup-row">
      <select id="duration-select">
        <option value="3">3 minutes</option>
        <option value="5" selected>5 minutes</option>
        <option value="10">10 minutes</option>
      </select>
      <button id="start-btn" class="primary">Start Writing</button>
    </div>
  </div>

  <!-- WRITE -->
  <div id="write-screen">
    <div id="editor-wrap">
      <textarea id="editor" placeholder="Start typing..." spellcheck="false"></textarea>
      <div id="danger-overlay"></div>
      <div id="erased-flash">Text erased — keep going</div>
      <div id="time-up-banner">Time's up — keep writing freely</div>
    </div>
  </div>

  <!-- END -->
  <div id="end-screen">
    <h2>Session complete.</h2>
    <div id="end-stats"></div>
    <div id="end-actions">
      <button id="end-download-btn" class="primary">Download .txt</button>
      <button id="restart-btn">New Session</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
